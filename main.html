<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IMDb Movie Page</title>
    <style>
        .moviePic {
            height: 400px;
            width: 300px;
            opacity: 0.9;
            display: block;
            margin: 20px auto;
        }

        .movieDetail {
            position: relative;
            top: 20px;
            width: 60%;
            margin: 0 auto;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <img
        class="moviePic"
        src="https://via.placeholder.com/300x400"
        alt="Movie Poster"
    >

    <p class="movieDetail">
        An epic story of adventure, courage, and friendship that takes viewers on an unforgettable journey.
    </p>

</body>
</html>
